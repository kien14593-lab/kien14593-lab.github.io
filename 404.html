<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang</title>
<script>
  // Trang cũ đã đổi tên: tự chuyển sang địa chỉ mới, giữ nguyên phần sau đường dẫn.
  (function () {
    var moved = { '/vuong-quoc-toan-hoc': '/vuong-quoc-hoc-vui' };
    var p = location.pathname;
    var lower = p.toLowerCase();
    for (var from in moved) {
      if (lower === from || lower.indexOf(from + '/') === 0) {
        location.replace(moved[from] + (p.slice(from.length) || '/') + location.search + location.hash);
        return;
      }
    }
  })();
</script>
<style>
  body { margin: 0; padding: 15vh 20px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; color: #4a3f6b; background: #fff6fa; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { font-size: 18px; margin: 6px 0; }
  a { color: #e05584; }
</style>
</head>
<body>
<h1>404 – Không tìm thấy trang</h1>

</body>
</html>
